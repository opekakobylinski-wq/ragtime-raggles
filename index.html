html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
.app{height:100vh;height:100dvh;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;line-height:1.3;width:190px}
.title b{display:block;font-size:20px;color:var(--ink);font-weight:700;letter-spacing:.02em;margin-left:-.45em}
.tempo{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:24px;padding:6px 8px;height:64px;width:430px;flex:0 1 430px;min-width:300px;
  box-shadow:0 4px 0 var(--line),0 8px 18px rgba(90,60,20,.08)}
.tbtn{flex:none;width:48px;height:48px;border-radius:50%;border:none;background:var(--bg);font-size:30px;font-weight:700;line-height:1;padding:0 0 3px;
  box-shadow:0 3px 0 var(--line);transition:transform .1s}
.tbtn:active{transform:translateY(2px);box-shadow:none}
.tico{flex:none;font-size:26px;line-height:1}
.tslider{position:relative;flex:1;height:52px;touch-action:none;cursor:pointer;outline:none}
.ttrack{position:absolute;left:30px;right:30px;top:50%;height:14px;margin-top:-7px;border-radius:7px;overflow:hidden;
  background:#8A7B6C}
.trest{position:absolute;top:0;right:0;bottom:0;background:#F1E4D0}
.tthumb{position:absolute;top:3px;left:0;width:72px;height:46px;border-radius:23px;background:#fff;border:4px solid var(--ink);
  display:flex;align-items:baseline;justify-content:center;gap:1px;padding-top:7px;font-weight:700;font-size:21px;line-height:1;
  box-shadow:0 4px 0 rgba(43,33,24,.18);transition:transform .1s}
.tthumb span{font-size:13px;color:var(--muted)}
.tslider.drag .tthumb,.tslider:focus-visible .tthumb{transform:scale(1.08)}
.btn.metro svg{width:42px;height:42px}
.btn.mic{position:relative;color:var(--ink)} .btn.mic svg{width:38px;height:38px}
.btn.mic .sl{display:none}
.btn.mic.on{background:var(--ink);color:#fff;box-shadow:0 6px 0 #000,0 12px 22px rgba(0,0,0,.2)}
.btn.mic.wait{opacity:.6}
.btn.mic.err{color:#B8A58E} .btn.mic.err .sl{display:inline}
.btn.mic.err::after,.btn.mic.hint::after{content:'';position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px #fff}
.btn.mic.err::after{content:'!';font:700 11px/14px Fredoka,system-ui,sans-serif;color:var(--ink);text-align:center}
.hear{position:absolute;top:8px;right:10px;z-index:7;display:none;align-items:center;gap:8px;height:46px;padding:4px 5px 4px 5px;
  background:#fff;border-radius:23px;box-shadow:0 2px 0 var(--line),0 6px 14px rgba(90,60,20,.10);max-width:calc(100% - 20px)}
.hear.show{display:flex}
.hear .hmic{width:18px;height:18px;margin-left:4px;flex:none;color:var(--muted)}
.hn{width:38px;height:38px;flex:none;border-radius:50%;background:#F3EBDF;color:#C9B9A4;font-weight:700;font-size:21px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:background .08s,color .08s}
.hn.on{background:var(--ink);color:#fff}
.hn.ok{animation:hnok .35s cubic-bezier(.3,1.7,.5,1)}
@keyframes hnok{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.lvl{position:relative;width:62px;height:10px;flex:none;border-radius:5px;background:#F3EBDF;overflow:hidden}
.lvl i{position:absolute;left:0;top:0;bottom:0;width:0;background:#9C8B78;border-radius:5px}
.lvl i.hot{background:var(--ink)}
.lvl b{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)}
.sens{flex:none;border:none;background:#F7F1E8;border-radius:19px;height:38px;padding:0 10px 0 9px;display:flex;align-items:center;gap:6px;
  font:600 11px/1 Fredoka,system-ui,sans-serif;color:var(--muted);cursor:pointer;touch-action:manipulation}
.sens .bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.sens .bars i{width:4px;border-radius:2px;background:#DDD0BE} .sens .bars i:nth-child(1){height:6px} .sens .bars i:nth-child(2){height:11px} .sens .bars i:nth-child(3){height:16px}
.sens .bars i.on{background:var(--ink)}
.hmsg{display:none;font-size:12px;line-height:1.3;color:#6E5E4C;padding:0 10px 0 2px;max-width:440px}
.hear.err .hn,.hear.err .lvl,.hear.err .sens{display:none} .hear.err .hmsg{display:block} .hear.err{height:auto;min-height:40px;padding:6px 6px}
.wk.heard{background:linear-gradient(#FFEFC2,#fff 80%)} .bk.heard{background:#6B5434}
.metro .mbody{fill:#E9DCCB} .metro .mface{fill:#fff} .metro .marm{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.metro .mwt{fill:var(--ink)} .metro .mpiv{fill:var(--ink)}
.btn.metro.on{background:var(--ink);box-shadow:0 6px 0 #000,0 12px 22px rgba(0,0,0,.2)}
.metro.on .mbody{fill:#F3EBDF} .metro.on .mface{fill:#fff} .metro.on .marm{stroke:var(--ink)} .metro.on .mwt{fill:var(--ink)}
.dot.tk{animation:beat .3s cubic-bezier(.3,1.7,.5,1);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--ink)}
.dot.cov.tk{box-shadow:inset 0 0 0 5px var(--c),0 0 0 4px #fff,0 0 0 8px var(--ink)}
.chips{display:flex;gap:10px}
.chip{position:relative;height:60px;min-width:76px;padding:0 14px;border:none;border-radius:22px;background:var(--card);
  display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 var(--line),0 8px 18px rgba(90,60,20,.08);transition:transform .15s}
.chip:active{transform:translateY(3px)}
.chip i{width:13px;height:13px;border-radius:50%;background:var(--ink);display:block}
.chip.cur{background:var(--ink)} .chip.cur i{background:#fff}
.chip .ok{position:absolute;top:-8px;right:-8px;width:26px;height:26px;display:none}
.chip.done .ok{display:block;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.stickers{display:flex;align-items:center;justify-content:flex-end;gap:6px;width:170px;font-size:30px;font-weight:700}
.stickers svg{width:46px;height:46px}
.stickers.bump svg{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}

/* ---------- song picker ---------- */
.songs{display:flex;gap:8px;flex:none;align-items:center}
.song{position:relative;display:flex;align-items:center;gap:8px;height:64px;padding:4px 14px 4px 6px;border:none;border-radius:22px;background:#F6EEE2;
  box-shadow:0 3px 0 var(--line);transition:transform .15s,opacity .2s;opacity:.78}
.song:active{transform:translateY(3px)}
.song.cur{background:var(--card);opacity:1;box-shadow:inset 0 0 0 3px var(--ink),0 4px 0 var(--line),0 8px 18px rgba(90,60,20,.08)}
.song .mi{width:52px;height:52px;flex:none;display:block}
.song .mi svg{width:100%;height:100%;overflow:visible;display:block}
.song .tt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.song .tt b{font-size:18px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.song .tt span{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;letter-spacing:.03em}
.song:not(.cur){padding:4px 6px} .song:not(.cur) .tt{display:none}
.hands{position:relative}
.hands .tg{position:absolute;left:50%;top:54%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:var(--gold);color:#fff;
  font-weight:700;font-size:26px;line-height:30px;text-align:center;box-shadow:0 0 0 3px #fff;transform:scale(0);transition:transform .2s;z-index:2}
.hands.both .tg{transform:scale(1)}
.tog{position:absolute;z-index:0;border-radius:20px;background:rgba(255,184,0,.13);border:3px dashed #FFB800;transition:opacity .3s,box-shadow .2s}
.tog.done{opacity:.32}
.tog.active{border-style:solid;box-shadow:0 0 0 4px rgba(255,184,0,.35),0 0 22px 6px rgba(255,184,0,.45)}
.tog .tgi{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:3px;padding:4px 7px;border-radius:16px;background:#fff;
  box-shadow:0 2px 0 #F1E4D0;font-weight:700;color:#C98A00;font-size:16px;line-height:1;white-space:nowrap}
.tog .tgi svg{width:22px;height:22px;border-radius:50%;padding:3px;flex:none}
.dot.two{--c:#2B2118}
.dot.two.past,.dot.two.now{background:linear-gradient(90deg,var(--L) 50%,var(--R) 50%)}
.dot.two.cov{box-shadow:inset 0 0 0 5px #FFB800}
.hn.two{font-size:14px;letter-spacing:-.02em}
.tail{transform-box:view-box;transform-origin:40px 52px}
.buddy.idle .tail,.buddy.dance .tail,.rbuddy .tail{animation:wag .6s ease-in-out infinite alternate}
@keyframes wag{0%{transform:rotate(-12deg)}100%{transform:rotate(14deg)}}

/* ---------- piano roll ---------- */
.roll{flex:1 1 auto;min-height:200px;order:1;position:relative;overflow:hidden;background:var(--card);border-radius:30px;
  box-shadow:0 6px 0 var(--line),0 14px 30px rgba(90,60,20,.08)}
.lane{position:absolute;left:0;right:0}
.legend{position:absolute;left:0;top:0;bottom:0;width:52px;z-index:5;background:linear-gradient(90deg,#fff 75%,rgba(255,255,255,0))}
.legend span{position:absolute;left:10px;width:30px;height:30px;border-radius:9px;background:#F3EBDF;color:#7A6A5A;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #E4D6C3}
.legend span svg{position:absolute;left:-7px;top:-8px;width:17px;height:17px}
.track{position:absolute;left:0;top:0;bottom:0;will-change:transform}
.blk{position:absolute;z-index:1;border-radius:16px;background:var(--c);box-shadow:inset 0 -6px 0 var(--cd);
  display:flex;align-items:center;justify-content:center;transition:opacity .3s,filter .3s,transform .2s}
.blk .f{width:var(--fs);height:var(--fs);border-radius:50%;background:#fff;color:var(--ink);font-weight:700;
  font-size:calc(var(--fs)*.66);display:flex;align-items:center;justify-content:center;margin-top:-4px;line-height:1}
.blk.done{opacity:.32;filter:saturate(.5)}
.blk.active{transform:scale(1.05);box-shadow:inset 0 -6px 0 var(--cd),0 0 0 4px #fff,0 0 0 8px var(--c),0 10px 22px rgba(0,0,0,.18);z-index:2}
.blk.hit{animation:hit .35s ease-out}
.bt{position:absolute;width:1px;background:#EFE6DA}
.bt i{position:absolute;top:-9px;left:-3px;width:7px;height:7px;border-radius:50%;background:#E2D5C3}
.bar{position:absolute;width:2px;background:#D6C5AE}
.bar.ph{width:4px;background:#C8B293;border-radius:2px}
.bar small{position:absolute;top:-17px;left:6px;font-size:11px;color:#C9B79F;font-weight:600}
.phb{position:absolute;display:flex;gap:4px;padding:7px 9px;border-radius:14px;background:var(--bg)}
.phb i{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.hseg{position:absolute;border-radius:12px;display:flex;align-items:center;justify-content:space-around;overflow:hidden}
.hseg svg{width:18px;height:18px;flex:none}
.goal{position:absolute;width:44px;height:44px}
.playline{position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:rgba(43,33,24,.2);z-index:3}
.buddy{position:absolute;left:0;top:0;width:56px;height:56px;z-index:6;will-change:transform;pointer-events:none}
.buddy .b{width:100%;height:100%;transform-origin:50% 100%}
.buddy.idle .b{animation:idle 1s ease-in-out infinite}
.buddy.dance .b{animation:dance .5s ease-in-out infinite}
.buddy svg{width:100%;height:100%;overflow:visible}

/* ---------- info row ---------- */
.mid{order:2;display:flex;justify-content:center;align-items:center;gap:28px}
.info{display:flex;justify-content:center;align-items:stretch;gap:14px}
.kbdwrap{order:3}
.card{background:var(--card);border-radius:26px;box-shadow:0 5px 0 var(--line),0 12px 26px rgba(90,60,20,.07)}
.hands{display:flex;gap:6px;padding:8px 14px;align-items:flex-end}
.hand{width:104px;height:108px;transition:opacity .25s,transform .25s;opacity:.22;transform:scale(.9);position:relative}
.hand.on{opacity:1;transform:scale(1)}
.hand svg{width:100%;height:100%;display:block}
.dots{display:flex;gap:14px;align-items:center;padding:0 22px}
.dot{width:56px;height:56px;border-radius:50%;background:#F6ECDD;color:#CDBBA3;font-size:26px;font-weight:700;
  display:flex;align-items:center;justify-content:center}  /* no transition: a dot lights on the exact frame of its click */
.dot.cov{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 5px var(--c)}
.dot.past{background:var(--c);color:var(--t);box-shadow:none}
.dot.now{background:var(--c);color:var(--t);box-shadow:0 0 0 5px #fff,0 0 0 9px var(--c);animation:beat .35s cubic-bezier(.3,1.7,.5,1)}
.dot.cnt{background:var(--ink);color:#fff;animation:beat .35s cubic-bezier(.3,1.7,.5,1)}
.dots.wait{animation:shake .4s}

/* ---------- keyboard ---------- */
.kbdwrap{display:flex;justify-content:center;flex:none}
.kbd{position:relative;display:flex;width:100%;max-width:980px;height:clamp(170px,25vh,236px);padding:14px 10px 12px;
  background:linear-gradient(#3A2C25,#2A1F1A);border-radius:28px;box-shadow:0 8px 0 #1C1411,0 16px 30px rgba(40,20,10,.25)}
.kbd::before{content:"";position:absolute;left:18px;right:18px;top:7px;height:4px;border-radius:2px;background:#6B5A4C}
.wk{position:relative;flex:1;margin:0 3px;border:none;padding:0;border-radius:6px 6px 18px 18px;
  background:linear-gradient(#FFFFFF 60%,#F5EDE2);box-shadow:inset 0 -8px 0 #E3D5C2,0 4px 0 #120C0A;transition:transform .08s,box-shadow .08s}
.wk.ctx{flex:.72;background:linear-gradient(#F4EEE6,#E7DDD0);box-shadow:inset 0 -8px 0 #D4C6B3,0 4px 0 #120C0A}
.wk.down,.wk.lit{background:linear-gradient(var(--cl),#fff 92%)}
.wk.down{transform:translateY(3px);box-shadow:inset 0 -4px 0 #E3D5C2,0 1px 0 #120C0A}
.wk.lit{box-shadow:inset 0 -8px 0 var(--c),0 4px 0 #120C0A}
.wk .st{position:absolute;left:50%;bottom:22px;width:min(62%,58px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:var(--c);box-shadow:0 0 0 4px #fff,0 3px 8px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;
  color:var(--t);font-weight:700;font-size:30px;transition:transform .2s}
.wk .st .num{display:none}
.wk .st .mc{position:absolute;left:-11px;top:-11px;width:26px;height:26px;filter:drop-shadow(0 2px 0 #C98A00)}
.wk.target .st{transform:translateX(-50%) scale(1.22)}
.wk.target .st .num{display:block}
.wk.target::after{content:"";position:absolute;inset:-5px;border-radius:10px 10px 22px 22px;border:5px solid var(--c);animation:ring 1.1s ease-out infinite;pointer-events:none}
.wk.nudge::after{animation:ring .45s ease-out 3}
.wk .nm{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;color:#C2B29C;font-weight:600}
.wk.wob,.bk.wob{animation:wob .4s}
.bk{position:absolute;top:14px;height:52%;border:none;padding:0;border-radius:3px 3px 8px 8px;z-index:3;pointer-events:none;  /* inert: taps fall through to the white key below */
  background:linear-gradient(#3E3C46,#1E1D24);box-shadow:inset 0 -5px 0 #0C0B10,0 3px 0 #0A0707;transition:transform .08s}
.bk.down{transform:translateY(2px);background:linear-gradient(#5A5966,#2A2930)}

/* ---------- controls ---------- */
.controls{display:flex;justify-content:center;align-items:flex-start;gap:22px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:5px}
.ctl small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;height:13px}
.btn{width:76px;height:76px;border-radius:50%;border:none;background:#fff;font-size:38px;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0;
  box-shadow:0 6px 0 #E6D5BE,0 12px 22px rgba(90,60,20,.12);transition:transform .1s,box-shadow .1s,background .2s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #E6D5BE,0 6px 12px rgba(90,60,20,.12)}
.btn.main{width:88px;height:88px;background:var(--ink);box-shadow:0 7px 0 #000,0 14px 26px rgba(43,33,24,.3);margin-top:-6px}
.btn.main:active{box-shadow:0 2px 0 #000}
.btn.main svg{width:40px;height:40px}
.btn.on{background:var(--ink);box-shadow:0 6px 0 #000,0 12px 22px rgba(0,0,0,.2)}
.btn svg{width:36px;height:36px}

/* ---------- reward ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.reward{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(255,247,234,.82);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.reward.show{display:flex}
.rcard{background:#fff;border-radius:36px;padding:28px 34px 26px;text-align:center;box-shadow:0 10px 0 var(--line),0 30px 60px rgba(90,60,20,.18);
  animation:pop .6s cubic-bezier(.3,1.5,.5,1);max-width:92vw}
.bigstars{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.bigstars svg{width:96px;height:96px;opacity:0}
.bigstars svg:nth-child(2){width:130px;height:130px}
.reward.show .bigstars svg{animation:starIn .55s cubic-bezier(.3,1.7,.5,1) forwards}
.reward.show .bigstars svg:nth-child(1){animation-delay:.25s}
.reward.show .bigstars svg:nth-child(2){animation-delay:.5s}
.reward.show .bigstars svg:nth-child(3){animation-delay:.75s}
.rbuddy{width:112px;height:112px;margin:6px auto 4px}
.rbuddy .b{animation:dance .5s ease-in-out infinite;transform-origin:50% 100%}
.collect{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px;margin:8px auto 18px}
.collect svg{width:40px;height:40px}
.collect svg.new{animation:pop .7s 1.1s cubic-bezier(.3,1.7,.5,1) backwards}
.collect .more{font-size:20px;font-weight:700;align-self:center;color:var(--muted)}
.wing{transform-box:view-box}
.wing.l{transform-origin:27px 44px} .wing.r{transform-origin:33px 44px}
.buddy.idle .wing,.buddy.dance .wing,.rbuddy .wing{animation:flap .32s ease-in-out infinite}
.rbuddy svg{width:100%;height:100%;overflow:visible}
.trail{position:absolute;width:9px;height:9px;z-index:5;pointer-events:none;animation:trail .8s ease-out forwards}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.55)}}
@keyframes trail{0%{opacity:.95;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(160deg)}}
.spark{position:absolute;width:22px;height:22px;z-index:7;pointer-events:none;animation:spark .9s ease-out forwards}

@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes starIn{0%{opacity:0;transform:scale(.2) rotate(-40deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1.05)}}
@keyframes beat{0%{transform:scale(.8)}100%{transform:scale(1.14)}}
@keyframes ring{0%{opacity:.9;transform:scale(.97)}100%{opacity:0;transform:scale(1.06)}}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-10px) scale(.96,1.05)}90%{transform:translateY(0) scale(1.08,.9)}}
@keyframes dance{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-12px)}}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg)}}


/* ---------- fullscreen (teacher) ---------- */
.hr{display:flex;align-items:center;justify-content:flex-end;gap:10px;width:190px;position:relative}
.hr .stickers{width:auto;order:0} .hr .fsb{order:1}
.fsb{flex:none;width:52px;height:52px;border:none;border-radius:16px;background:rgba(255,255,255,.7);color:var(--muted);padding:5px 0 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 2px 0 var(--line);transition:transform .1s}
.fsb:active{transform:translateY(2px);box-shadow:none}
.fsb svg{width:24px;height:24px}
.fsb small{font-size:10px;font-weight:600;line-height:1;letter-spacing:.05em}

const SONGS = [
  { id:'rtr', title:'拉格泰姆舞', sub:'Rag-Time Raggles', bpb:4, mascot:'fairy',
    keyHand:{57:'L', 59:'L', 60:'', 62:'R', 64:'R'},   // C (60) is shared: it takes the colour of the hand playing now

    finger:{R:{C4:1,D4:2,E4:3}, L:{C4:1,B3:2,A3:3}},

    keyHand:{55:'L', 60:'', 62:'R', 64:'R'},

    finger:{R:{C4:1,D4:2,E4:3}, L:{C4:1,B3:2,A3:3,G3:4}},

function handSVG(hand){
  const W = 122, fingers = [
    {n:1,x:24,y:62,w:27,h:50,r:-34}, {n:2,x:32,y:16,w:21,h:68,r:0}, {n:3,x:55,y:7,w:21,h:76,r:0},
    {n:4,x:78,y:16,w:21,h:68,r:0},   {n:5,x:100,y:34,w:18,h:52,r:0}];
  const mx = (x,w) => hand==='R' ? x : W-x-w;
  let s = `<svg viewBox="0 0 ${W} 132">`;
  fingers.forEach(F => {
    const x = mx(F.x,F.w), cx = x+F.w/2, by = F.y+F.h, r = hand==='R'?F.r:-F.r;
    s += `<g transform="rotate(${r} ${cx} ${by})" data-f="${F.n}"><rect x="${x}" y="${F.y}" width="${F.w}" height="${F.h}" rx="${F.w/2}" fill="#FFE2CC" stroke="#E7B392" stroke-width="3"/>`
      + `<text x="${cx}" y="${F.y+F.w/2+1}" transform="rotate(${-r} ${cx} ${F.y+F.w/2+1})" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#C79A7B" font-family="inherit">${F.n}</text></g>`;   // number stays upright on the tilted thumb
  });
  s += `<rect x="${hand==='R'?30:W-30-90}" y="62" width="90" height="64" rx="30" fill="#FFE2CC" stroke="#E7B392" stroke-width="3"/>`;
  s += `<rect x="${hand==='R'?34:W-34-82}" y="66" width="82" height="58" rx="27" fill="#FFE2CC"/>`;
  s += `<circle cx="${W/2+ (hand==='R'?14:-14)}" cy="100" r="13" fill="${HC[hand].c}"/>`;
  s += `<use href="#${hand==='R'?'mhR':'mhL'}" x="${W/2+(hand==='R'?14:-14)-8}" y="92" width="16" height="16"/>`;
  return s + '</svg>';
}

function layoutKeys(){
  // standard proportions: every black key is the same size (58% of a full white key), sits on the boundary between its two

  const ref = keyEl[60], kb = $('kbd'); if (!ref || !ref.offsetWidth) return;
  const w = Math.round(ref.offsetWidth*0.58), lean = {54:-1,56:0,58:1,61:-1,63:1,66:-1};
  const st = ref.querySelector('.st'), stTop = ref.offsetTop + st.offsetTop - st.offsetHeight*0.12;  // dot top incl. the 1.22× target pop
  const top = ref.offsetTop, h = Math.max(36, Math.min(ref.offsetHeight*0.56, stTop - top - 10));

    k.el.style.width = w+'px'; k.el.style.left = Math.round(edge - w/2)+'px'; k.el.style.top = top+'px'; k.el.style.height = Math.round(h)+'px';

let G = {}, blkEls = [];
function fitTight(){   // short phone screens (Safari toolbars, or home-screen app with notch insets): give the note roll room
  const a = $('app'); a.classList.remove('tight','tight2','tightT');
  if (innerWidth > 640) { if (innerWidth <= 1060 && $('roll').clientHeight < 270) a.classList.add('tightT'); return; }
  if ($('roll').clientHeight < 270) a.classList.add('tight');
  if ($('roll').clientHeight < 250) a.classList.add('tight2');
}
function buildRoll(){
  fitTight();
  const roll = $('roll'), W = roll.clientWidth, H = roll.clientHeight;
  const NL = LANES.length, beatW = W < 640 ? 54 : 76, short = W < 640 && H < 280, topPad = short ? 54 : 66, handH = short ? 24 : 30, laneH = (H - topPad - handH - 12)/NL;
  const playX = Math.max(96, Math.round(W*(W<640?0.3:0.27)));
  G = {W,H,beatW,topPad,laneH,playX,handH};
  const laneTop = p => topPad + LANES.indexOf(p)*laneH;
  // lanes + legend (fixed)
  let lh = '', lg = '';
  LANES.forEach((p,i) => {
    lh += `<div class="lane" style="top:${topPad+i*laneH}px;height:${laneH}px;background:${i%2?'#FFFDF9':'#FAF5EE'}"></div>`;
    lg += `<span style="top:${topPad+i*laneH+laneH/2-15}px">${p[0]}${p==='C4'?'<svg><use href="#star"/></svg>':''}</span>`;
  });
  $('lanes').innerHTML = lh; $('legend').innerHTML = lg;

  notes.forEach((n,i) => {
    n.parts.forEach(pt => {
      const c = HC[pt.h];   // left edge sits exactly on the note's beat line, so it meets the playhead as the note sounds
      t += `<div class="blk n${i}" data-m="${pt.m}" style="left:${n.start*beatW}px;top:${laneTop(pt.p)+4}px;width:${n.d*beatW-6}px;height:${laneH-8}px;--c:${c.c};--cd:${c.cd};--fs:${fs}px">`
         + `<span class="f">${pt.f}</span></div>`;
    });
    if (n.chord){   // both hands together: one golden frame around the chord + a "left hand + right hand" badge between the blocks
      const ls = n.parts.map(pt => LANES.indexOf(pt.p)), a = Math.min(...ls), z = Math.max(...ls);
      t += `<div class="tog n${i}" style="left:${n.start*beatW-5}px;top:${topPad+a*laneH}px;width:${n.d*beatW+4}px;height:${(z-a+1)*laneH}px">`
         + (z-a>1 ? `<span class="tgi">${mh('L')}+${mh('R')}</span>` : '') + '</div>';
    }
  });
  const bottom = topPad + NL*laneH;
  for (let b=0; b<TOTAL; b++) if (b%BPB) t += `<div class="bt" style="left:${b*beatW}px;top:${topPad}px;height:${bottom-topPad}px"><i></i></div>`;
  for (let b=0; b<=BARS.length; b++){
    const isPh = PHRASES.some(([a])=>a===b) || b===BARS.length;
    t += `<div class="bar${isPh?' ph':''}" style="left:${b*BPB*beatW-(isPh?2:1)}px;top:${topPad}px;height:${bottom-topPad}px">${b<BARS.length?`<small>${b+1}</small>`:''}</div>`;
  }
  PHRASES.forEach(([a],i) => { t += `<div class="phb" style="left:${a*BPB*beatW+10}px;top:14px">${'<i></i>'.repeat(i+1)}</div>`; });
  // hand lane segments: runs of notes played by the same hand (a chord run shows both hands)
  let s = 0;
  while (s < N){ let e = s; while (e+1<N && notes[e+1].h===notes[s].h) e++;
    const h = notes[s].h, x0 = notes[s].start, nb = notes[e].start + notes[e].d - x0;

    t += `<div class="hseg" style="left:${x0*beatW+4}px;top:${bottom+6}px;width:${nb*beatW-8}px;height:${handH}px;background:${bg}">${ic}</div>`;
    s = e+1; }
  t += `<svg class="goal" style="left:${TOTAL*beatW+18}px;top:${topPad+LANES.indexOf('C4')*laneH+laneH/2-22}px"><use href="#star"/></svg>`;

// One time base for sound AND picture: the AudioContext clock.
//  * Audio is scheduled ahead (lookahead scheduler) at exact ctx times.
//  * Each rAF frame reads the *audible* ctx time (output-latency compensated) and computes beat = clock(t).
//  * A clock is piecewise linear: each tempo change appends an anchor (timeAtChange, beatAtChange, secPerBeat),
//    so already-scheduled clicks never move and the picture never jumps.
const spbNow = () => 60/tempo;

function clkTime(C, p){ let g = C.segs[0]; for (const x of C.segs) if (x.p0 <= p) g = x; return g.t0 + (p - g.p0)*g.spb; }
function clkTempo(C, T, spb){ const p = clkPos(C, T); C.segs = C.segs.filter(x => x.t0 < T); C.segs.push({t0:T, p0:p, spb}); if (C.segs.length > 8) C.segs.shift(); }
// audible time = what the speaker is playing right now, on the ctx clock
function audioNow(){

  if (ctx.state !== 'running') return ct;
  if (ctx.getOutputTimestamp){
    const ts = ctx.getOutputTimestamp();
    if (ts && ts.contextTime > 0 && ts.performanceTime > 0){
      const t = ts.contextTime + (performance.now() - ts.performanceTime)/1000;
      if (t <= ct + 0.002 && t > ct - 0.5) return t;

function metroStop(){ M.live = false; lastBeat = null; }

function scheduler(){

const matches = (m,n,src) => m===n.m || ((src==='midi'||src==='mic') && m%12===n.m%12);

// ---- chords: both keys must go down together (within CHORD_WIN of each other) or one held while the other is pressed
const CHORD_WIN = 300;

}

    + `<span class="mi">${MASCOT[g.mascot]}</span><span class="tt"><b>${g.title}</b><span>${g.sub}</span></span></button>`).join('');
  $('songs').querySelectorAll('.song').forEach(b => b.addEventListener('pointerdown', e => {
    e.preventDefault(); ensureAudio();
    if (b.dataset.id !== S.id){ loadSong(b.dataset.id); chime([72,79],.1,.2); }
  }));
}
function loadSong(id){
  const g = SONGS.find(x => x.id===id) || SONGS[0];
  stopAll(); hideReward(); metroStop();
  const bd = $('buddy'); bd.dataset.dance = ''; bd.classList.remove('dance');
  compileSong(g);
  try { localStorage.setItem('rtr_song', g.id); } catch(e){}
  mode = 'step'; idx = 0; pos = 0; activeIdx = -1; lastBeat = null;
  phraseDone = PHRASES.map(() => false);
  document.title = `《${g.title}》${g.sub} · 小手练琴`;
  $('songs').querySelectorAll('.song').forEach(b => { const on = b.dataset.id===g.id; b.classList.toggle('cur', on); b.setAttribute('aria-selected', on); });

  buildRoll(); layoutKeys(); updateChips(0);

}
